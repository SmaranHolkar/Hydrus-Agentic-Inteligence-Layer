[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrus-gbps"
version = "0.1.0"
description = "Grounded Belief Path Search (GBPS) - Real-time Hallucination & Grounding Verification Engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "HydrusOPT Team", email = "dev@hydrusopt.com" }]
dependencies = [
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.22.0", "pydantic>=2.0"]
embeddings = ["sentence-transformers>=2.2.0"]
all = [
    "torch>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "sentence-transformers>=2.2.0"
]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/hydrus_gbps"]
