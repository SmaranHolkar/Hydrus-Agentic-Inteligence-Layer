[package]
name = "hail-desktop"
version = "0.1.0"
description = "HAIL Desktop — Hardware-Efficient Local AI Platform"
authors = ["Vivere Labs <info@vivere-labs.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
