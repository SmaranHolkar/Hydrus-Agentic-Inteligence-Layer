<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydrusOpt — Multi-Profile Benchmark Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --bg-card: #161b22; --bg-card-alt: #0d1117;
      --border: #30363d; --border-highlight: #8b949e; 
      --text: #c9d1d9; --text-sec: #8b949e; --text-muted: #6e7681;
      --green: #3fb950; --green-dim: rgba(63,185,80,0.1);
      --amber: #d29922; --amber-dim: rgba(210,153,34,0.1);
      --red: #f85149; --red-dim: rgba(248,81,73,0.1);
      --blue: #58a6ff; --blue-dim: rgba(88,166,255,0.1);
      --indigo: #58a6ff; 
      --radius: 2px; --radius-lg: 4px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .hero { background: var(--bg-card); padding: 40px 32px 32px; text-align: center; border-bottom: 1px solid var(--border); }
    .hero h1 { font-size: 2rem; font-weight: 600; color: #c9d1d9; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .hero h1 svg { width: 28px; height: 28px; stroke: var(--text-sec); }
    .hero .sub { color: var(--text-sec); margin-top: 8px; font-size: 0.95rem; }
    
    .tabs { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
    .tab-btn { background: var(--bg); color: var(--text-sec); border: 1px solid var(--border); padding: 6px 16px; border-radius: var(--radius); font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: 0.1s; }
    .tab-btn:hover { border-color: var(--border-highlight); color: var(--text); }
    .tab-btn.active { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .profile-view { display: none; }
    .profile-view.active { display: block; animation: fadeIn 0.2s ease-out; }
    
    .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .section-title svg { width: 18px; height: 18px; stroke: var(--text-sec); }
    
    .speed-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .speed-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; position: relative; }
    .speed-card .label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .speed-card .big { font-size: 2.2rem; font-weight: 600; line-height: 1.1; color: var(--text); }
    .speed-card .unit { font-size: 0.9rem; color: var(--text-sec); font-weight: 400; }
    .speed-card .delta { margin-top: 8px; font-size: 0.8rem; color: var(--text-sec); }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; }
    .prompt-title { font-weight: 600; margin-bottom: 16px; padding-left: 12px; border-left: 3px solid var(--border-highlight); font-size: 0.95rem; }
    
    .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .output-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .output-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .output-label svg { width: 14px; height: 14px; }
    .output-text { font-size: 0.85rem; color: var(--text); white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .verdict-row { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 12px; }
    .verdict-badge { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius); font-size: 0.75rem; font-weight: 500; border: 1px solid var(--border); background: var(--bg); color: var(--text-sec); }
    .verdict-badge svg { width: 12px; height: 12px; }
    .verdict-badge.pass { border-color: var(--green); color: var(--green); background: var(--green-dim); }
    .verdict-badge.blocked { border-color: var(--red); color: var(--red); background: var(--red-dim); }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <header class="hero">
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      HydrusOpt Benchmark
    </h1>
    <p class="sub">Qwen/Qwen2-1.5B-Instruct — Multi-Profile Analysis</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('fast')">FAST Profile</button>
      <button class="tab-btn" onclick="showTab('safe')">SAFE Profile</button>
      <button class="tab-btn" onclick="showTab('eval')">EVAL Profile</button>
    </div>
  </header>

  <main class="container">
    <div id="content"></div>
  </main>

  <script>
    const icons = {
      cpu: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>',
      terminal: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>',
      check: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
      x: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
      info: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
      shield: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
      baseline: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>'
    };

    const data = {
      fast: {
        baseline_tok: 22.8, baseline_lat: 3.41,
        hydrus_tok: 23.2, hydrus_lat: 3.46, tax: 1.6,
        runs: [
          { p: "What is 2+2? Answer with one integer only.", b: "1\\n\\nThe answer is 1, because the question asks for an integer only.\\n\\nIf you're asking for a mathematical operation, then it's 4 (addition). \\n\\nIf you're", h: "4", v: "pass", vt: "Passed (99.85%)", conf: 99.85, u: 0, n: "Enforced integer" },
          { p: "What is the capital of France?", b: "The capital of France is Paris. \\n\\nParis is the second-largest city in France and is also the country's most populous city, with a population of over 2 million people. It is located on", h: "The capital of France is Paris.", v: "pass", vt: "Passed (97.48%)", conf: 97.48, u: 0, n: "Clean output" },
          { p: "What were the main causes of World War 1?", b: "The main causes of World War I were:\\n\\n1. Imperialism: The desire for colonies and territories in Asia, Africa, and Latin America led to tensions between European powers.\\n\\n2. Nationalism:", h: "I am not confident enough to answer this accurately right now. Reason: high uncertainty (58% low-confidence decode steps). Please verify with a trusted source.", v: "blocked", vt: "Blocked (58% uncertain)", conf: 64.21, u: 58.08, n: "Safe fallback" }
        ]
      },
      safe: {
        baseline_tok: 22.9, baseline_lat: 1.66,
        hydrus_tok: 23.4, hydrus_lat: 8.91, tax: 437.1,
        runs: [
          { p: "What is 2+2? Answer with one integer only.", b: "1\\n\\nThe answer is 1, because the question asks for an integer only.\\n\\nIf you're asking for a mathematical operation, then it's 4 (addition). \\n\\nIf you're", h: "4", v: "pass", vt: "Verified (Consensus)", conf: 63.92, u: 50.0, n: "Fallback -> Verified" },
          { p: "What is the capital of France?", b: "The capital of France is Paris. \\n\\nParis is the second-largest city in France and the most populous city in the country, with a population of over 2 million people. It is also the center", h: "The capital of France is Paris.", v: "pass", vt: "High-Conf Bypass", conf: 97.01, u: 0, n: "Skipped verify" },
          { p: "What were the main causes of World War 1?", b: "The main causes of World War I were:\\n\\n1. Imperialism: The desire for colonies and territories in Asia, Africa, and Latin America led to tensions between European powers.\\n\\n2. Nationalism:", h: "I am not confident enough to answer this accurately right now. Reason: high uncertainty (71% low-confidence decode steps). Please verify with a trusted source.", v: "blocked", vt: "Blocked (71% uncertain)", conf: 40.79, u: 70.83, n: "Fallback -> Verified" }
        ]
      },
      eval: {
        baseline_tok: 32.5, baseline_lat: 3.53,
        hydrus_tok: 31.8, hydrus_lat: 7.30, tax: 106.9,
        runs: [
          { p: "What is 2+2? Answer with one integer only.", b: "1\\n\\nThe answer is 1, because the question asks for an integer only.\\n\\nIf you're asking for a mathematical operation, then it's 4 (addition). \\n\\nIf you're", h: "4", v: "pass", vt: "Passed", conf: 99.90, u: 0, n: "Enforced integer" },
          { p: "What is the capital of France?", b: "is the capital of France? The capital of France is Paris. \\n\\nParis is the second-largest city in France and is also the country's most populous city, with a population of over 2 million people. It is ", h: "The capital of France is Paris.", v: "pass", vt: "High-Conf Bypass", conf: 97.48, u: 0, n: "Clean output" },
          { p: "What were the main causes of World War 1?", b: "The main causes of World War I were:\\n\\n1. Imperialism: The desire for colonies and territories in Asia, Africa, and Latin America led to tensions between European powers.\\n\\n2. Nationalism:", h: "The main causes of World War 1 were centralization of power in Germany and Austria-Hungary, imperialist territorial disputes, assassination of Archduke Franz Ferdinand of Austria by Serbian nationalist Gavrilo Princip, alliance system between Germany", v: "pass", vt: "Verified", conf: 65.94, u: 42.55, n: "LLM-only accepted" }
        ]
      }
    };

    function renderView(profile) {
      const d = data[profile];
      return `
        <div class="profile-view active">
          <div class="section-title">
            ${icons.cpu} Performance & Latency
          </div>
          <div class="speed-grid">
            <div class="speed-card" style="border-bottom: 2px solid var(--text-muted)">
              <div class="label">Baseline</div>
              <div class="big">${d.baseline_tok} <span class="unit">tok/s</span></div>
              <div class="delta">Reference latency: ${d.baseline_lat}s</div>
            </div>
            <div class="speed-card" style="border-bottom: 2px solid var(--green)">
              <div class="label">HydrusOpt</div>
              <div class="big" style="color: var(--green)">${d.hydrus_tok} <span class="unit">tok/s</span></div>
              <div class="delta">Latency: ${d.hydrus_lat}s</div>
            </div>
            <div class="speed-card" style="border-bottom: 2px solid var(--blue)">
              <div class="label">Safety Tax</div>
              <div class="big" style="color: var(--blue)">${d.tax}% <span class="unit">latency</span></div>
              <div class="delta">Overhead for verification</div>
            </div>
          </div>
          <div class="section-title">
            ${icons.terminal} Prompt Analysis
          </div>
          ${d.runs.map(r => `
            <div class="card">
              <div class="prompt-title">${r.p}</div>
              <div class="output-grid">
                <div class="output-box">
                  <div class="output-label" style="color: var(--text-sec)">${icons.baseline} Baseline Output</div>
                  <div class="output-text">${r.b}</div>
                </div>
                <div class="output-box">
                  <div class="output-label" style="color: var(--green)">${icons.shield} HydrusOpt Output</div>
                  <div class="output-text">${r.h}</div>
                </div>
              </div>
              <div class="verdict-row">
                <span class="verdict-badge ${r.v === 'pass' ? 'pass' : 'blocked'}">
                  ${r.v === 'pass' ? icons.check : icons.x} ${r.vt}
                </span>
                <span class="verdict-badge">Conf: ${r.conf}%</span>
                <span class="verdict-badge">Uncertain: ${r.u}%</span>
                <span class="verdict-badge">${icons.info} ${r.n}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function showTab(p) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('content').innerHTML = renderView(p);
    }

    document.getElementById('content').innerHTML = renderView('fast');
  </script>
</body>
</html>
