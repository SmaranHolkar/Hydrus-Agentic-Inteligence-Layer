[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hail-core"
version = "0.1.0"
description = "Adaptive, hardware-efficient persistent memory for local LLMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Smaran", email = "you@vivere-labs.com" }]
dependencies = [
    "numpy>=1.24,<3",
    "cryptography>=42,<48",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "bandit>=1.7", "pip-audit>=2", "mypy>=1.10"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/vivere-labs/hail"
Documentation = "https://vivere-labs.github.io/hail"
Repository = "https://github.com/vivere-labs/hail"

[tool.hatch.build.targets.wheel]
packages = ["src/hail_core"]

[tool.mypy]
strict = true
packages = ["hail_core"]
